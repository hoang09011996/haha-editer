<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>vidflow Studio</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>vidflow</h1>
  <select id="projectSel" aria-label="Chọn project"></select>
  <button id="newBtn">+ Video mới</button>
  <span style="flex:1"></span>
  <span id="jobPill" class="pill">Rảnh</span>
</header>
<main id="main"><div class="empty">Đang tải…</div></main>
<div class="savebar" id="savebar" hidden>
  <span id="dirtyMark"></span>
  <button id="reloadBtn">Hoàn tác thay đổi</button>
  <button id="saveBtn" class="primary">Lưu (Cmd+S)</button>
</div>
<div class="toast" id="toast"></div>

<dialog id="newDlg">
  <form method="dialog" id="newForm">
    <h3 style="margin-top:0;color:#000080">Video mới</h3>
    <div class="grid">
      <label class="f wide">Ý tưởng<textarea name="idea" required placeholder="vd: video hài 20s về cà phê sáng, nhân vật đeo kính tóc rẽ ngôi"></textarea></label>
      <label class="f">Tựa<input type="text" name="title" required></label>
      <label class="f">Tên thư mục (không dấu)<input type="text" name="name" required pattern="[a-z0-9][a-z0-9_-]*" placeholder="cafe-sang-2"></label>
      <label class="f">Tỉ lệ<select name="aspect"><option>9:16</option><option>16:9</option></select></label>
      <label class="f">Model video (Google Flow)<select name="video_model" required><option value="">— chọn —</option><option>Veo 3.1 Lite</option><option>Veo 3.1 Fast</option><option>Veo 3.1 Quality</option><option>Omni 1.1 Flash</option></select></label>
      <label class="f">Độ phân giải tải về<select name="resolution"><option>720p</option><option>1080p</option></select></label>
      <label class="checks wide"><label><input type="checkbox" name="start" checked> Bắt đầu: Claude viết kịch bản chi tiết ngay</label></label>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button value="cancel" formnovalidate>Hủy</button><button value="ok" class="primary">Tạo</button>
    </div>
  </form>
</dialog>
<script src="/static/app.js"></script>
</body>
</html>
